<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Esafe Sales Rep</title>
  <link rel="icon" type="image/png" href="/assets/lumenpos/pos/icon-192.png">
  <link rel="manifest" href="/assets/lumenpos/pos/manifest.json">
  <meta name="theme-color" content="#10254B">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Esafe Sales Rep">
  <link rel="apple-touch-icon" href="/assets/lumenpos/pos/icon-192.png">
  <link rel="stylesheet" href="/assets/lumenpos/pos/pos.css?v={{ lumenpos_version }}">
</head>
<body>
  <div id="app"></div>
  <script>
    window.csrf_token = "{{ csrf_token }}";
    window.lumenpos_version = "{{ lumenpos_version }}";
    // Keep the shell on the device so the till opens with no connection at
    // all, and so a reload during an outage is not the end of the shift.
    // Registered with the version, a release is a new worker and a new cache.
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker
          .register("/sw.js?v={{ lumenpos_version }}", { scope: "/pos" })
          .catch(function () {
            /* no service worker (old browser, plain http): the till still works online */
          });
      });
    }
  </script>
  <script type="module" src="/assets/lumenpos/pos/pos.js?v={{ lumenpos_version }}"></script>
</body>
</html>
